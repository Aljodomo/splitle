services:
  postgres:
    image: postgres:16-alpine
    container_name: splitle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: splitle
      POSTGRES_PASSWORD: splitle_secret
      POSTGRES_DB: splitle_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitle -d splitle_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
